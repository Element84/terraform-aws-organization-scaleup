name: terraform apply

# Using the terraform plan file that was generated by opening (or updating) the PR,
# run terraform apply to deploy the changes anytime a commit to main occurs.
on:
  push:
    branches:
      - "main"

jobs:
  tf-apply:
    name: terraform apply
    runs-on: ubuntu-latest
    env:
      TERRAFORM_WORKING_DIR: src
      # helps ensure we never accidentally deploy to the wrong account
      TF_VAR_rootmgmt_account_id: '["${{ secrets.TF_VAR_rootmgmt_account_id }}"]'
    permissions:
      id-token: write   # required to request the OIDC JWT
      actions: read
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read the terraform version from the .terraform-version file, and then install that version
      - name: Get Terraform version
        id: tf_version
        run: |
          echo "value=$(cat ./src/.terraform-version)" >> $GITHUB_OUTPUT
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf_version.outputs.value }}

      - name: Get PR Number & Artifact Name
        id: find_artifact_info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Use the default GITHUB_TOKEN (which needs 'actions: read' permission)
          github-token: ${{ secrets.GITHUB_TOKEN }} 
          script: |
            // 1. Find the PR associated with the commit that just landed on main
            const prResponse = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (!prResponse.data || prResponse.data.length === 0) {
              core.setFailed("Error: Could not find PR associated with merge commit to locate artifact.");
              return;
            }

            const prNumber = prResponse.data[0].number;
            console.log(`Found PR #${prNumber} associated with the merge commit`);
            const artifactName = `terraform-plan-${prNumber}`;

            // 2. Find the workflow run that created this artifact 
            // We search for runs of the planning workflow on the head commit of the PR.
            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tf_plan.yaml', // <-- name of the tf plan workflow
              event: 'pull_request',
              status: 'success',
              head_sha: prResponse.data[0].head.sha, // Use the commit SHA from the PR head
            });
            
            // Assuming the latest successful run is the correct one
            const planRun = runsResponse.data.workflow_runs[0];

            if (!planRun) {
                core.setFailed(`No successful plan run found for PR #${prNumber}.`);
                return;
            }

            console.log('planRun', planRun);
            console.log('planRun.id', planRun.id);
            console.log('artifactName', artifactName);

            // Set outputs for subsequent steps
            core.setOutput('pr_number', prNumber);
            core.setOutput('artifact_name', artifactName);
            core.setOutput('run_id', planRun.id);

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_artifact_info.outputs.run_id }}
          name: ${{ steps.find_artifact_info.outputs.artifact_name }}
          path: ${{ env.TERRAFORM_WORKING_DIR }}

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The deploy role (src/service_iam.tf) lives in the management account.
          # TODO: set the TF_VAR_rootmgmt_account_id repository secret to your
          # management account ID, and the AWS_REGION repository variable to
          # your home_region.
          role-to-assume: arn:aws:iam::${{ secrets.TF_VAR_rootmgmt_account_id }}:role/github-actions-deploy-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          terraform init -input=false

      # terraform apply using the plan file generated in the PR
      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          terraform apply -input=false tfplan.out
